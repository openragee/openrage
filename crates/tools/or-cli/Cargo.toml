[package]
name = "or-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "openrage-cli: convert, inspect, search and serve RAGE resources"

[dependencies]
# The RAGE string hashes and the reverse index over them, for `hash`/`names`,
# `.awc` for `awc`, `.gfx` for `gfx`, the metadata family for `meta`,
# texture import and encoding for `texture`, and GTA VI's packs for `ttpf`.
or-io = { workspace = true, features = ["authoring", "awc", "fxc", "gfx", "gta6", "meta", "rel"] }
# The one decode of an `.awc` stream, whichever codec it is stored in, for `awc export`.
or-media.workspace = true
or-title.workspace = true
# The world model, for openrage-cli world on a `.ymap` or `.ytyp`.
or-world.workspace = true
# The vector type `or_world::generate` takes a drawable's bounds in.
glam.workspace = true
# The dependency graph over a mount, for openrage-cli depends.
or-depends.workspace = true
# The project container, for openrage-cli project.
or-project.workspace = true
# The folders an asset is edited as, for openrage-cli project import.
or-source.workspace = true
# The clothing engine, for openrage-cli wardrobe and for the clothing content of a project.
or-wardrobe.workspace = true
# The addon ped engine, for openrage-cli addonped.
or-addonped.workspace = true
or-weapons.workspace = true
or-particles.workspace = true
or-maps.workspace = true
# The kinds of content this build knows, listed once.
or-content.workspace = true
# The animation runtime, for openrage-cli inspect on a clip dictionary.
or-anim.workspace = true
# The interchange model, for openrage-cli mesh.
or-interchange.workspace = true
# Cancellation and progress-as-data. ⚠ This used to be a local module, and a
# stderr rate limiter is the one shape the editor cannot render.
or-job.workspace = true
# Where the MCP clients keep their configuration, for `mcp install`.
dirs.workspace = true
# The DXIL front end GTA VI's programs go through, for `rpf scan-shaders` and the app's Shaded
# view, and the SHA-1 a translated program is keyed by.
or-shader-front.workspace = true
sha1.workspace = true

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Publish streamed archive exports only after decoding succeeds.
tempfile.workspace = true
# The shared keys cache lives under the user's config directory.
# `script download-natives` fetches the natives lists, only when asked; the
# same client and features `or-shader-tool` already builds.
ureq = { version = "3.1", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
# Finds the shared corpus the behaviour baseline samples.
or-test-support.workspace = true
# The editor's calls that make the small particle list the command tests build a pack from.
or-particle.workspace = true
