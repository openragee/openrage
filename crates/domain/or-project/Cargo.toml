[package]
name = "or-project"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The project container: the content and builds a .openrage-proj declares, the plan of a build and the executor that writes it"

[dependencies]
# The file is read field by field through `Value`, so one unreadable field
# costs itself and never the file.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The digest of a file a kind of content looks at, which the diff of two builds compares.
sha2 = "0.10"
# The random bytes of the stable id of a thing a kind of content keeps.
getrandom = "0.3"
# The readers a build reloads what it wrote through, and the metadata a `.ymt` is read as.
or-io = { workspace = true, features = ["meta", "gta6"] }
# The DLC pack and the .oiv package an output can be.
or-title.workspace = true
# How far a build has got and the flag that stops it.
or-job.workspace = true
# The zip a mapping comes in as, listed from its directory and unpacked only when it is adopted; such a zip is deflated.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile.workspace = true
# The shared corpus: real `.ytd` and `.ydr` files for the reload check.
or-test-support.workspace = true
# The zlib chunks of the synthetic RPF9 archives the GTA VI project tests lay out.
flate2.workspace = true
# The archives the tests of a place write, with the crate that reads them.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
