'''
# slow-tier:end
slow-timeout = { period = "10s", terminate-after = 3 }

# Every run leaves per-test timings in `target/nextest/<profile>/junit.xml`.
[profile.default.junit]
path = "junit.xml"

# Every test. One still running at 15 minutes is terminated and named as the failure it is. The corpus suites of the
# libraries are long on purpose: the slowest of a whole-workspace run under load passed at 287 s, so none may be held to less.
[profile.all]
default-filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 15 }

[profile.all.junit]
path = "junit.xml"

# The digests of the GTA VI world build the install's index afresh, then read models, textures and maps of it and
# select at each camera of the reference script: TIMED beside building lanes, so it is held to ninety. It stands
# before the app's own limit, which a test takes from the first override that names it.
[[profile.all.overrides]]
filter = 'test(the_world_reads_as_its_reference_says)'
slow-timeout = { period = "60s", terminate-after = 90 }

# The app's tests are short: the slowest of a whole-suite run under load took 114 s, and one test once sat idle for
# 39 minutes, which held a gate and said nothing of which test it was. One still running at 300 s is terminated.
[[profile.all.overrides]]
filter = 'binary_id(openrage::bin/openrage)'
slow-timeout = { period = "30s", terminate-after = 10 }

# The corpus suites start before the unit tests, and the longest of them before the rest: a long test that starts
# last leaves the run waiting on it alone.
[[profile.all.overrides]]
filter = 'package(or-io-verify) | package(or-source) | package(or-world) | package(or-world-gta5) | package(or-wardrobe) | package(or-plugin) | package(or-anim)'
priority = 25

[[profile.all.overrides]]
filter = 'test(the_target_sample_runs_on_a_staged_file) | test(every_staged_ydd_comes_back_through_the_sample_guest_with_its_distances_doubled) | test(every_corpus_clip_poses_as_recorded) | test(what_a_reencoded_clip_drops)'
priority = 100

# The two install suites of the particle source form read every `.ypt` of an install, make its source, compile it and import it again.
# The Enhanced one took eleven minutes under the load of a whole-workspace run, so these are held to forty-five, and start first.
[[profile.all.overrides]]
filter = 'test(every_ypt_of_a_legacy_install_becomes_a_source_that_compiles_and_imports_to_the_same_source) | test(every_ypt_of_an_enhanced_install_becomes_a_source_that_compiles_and_imports_to_the_same_source)'
slow-timeout = { period = "60s", terminate-after = 45 }
priority = 100

# The shape-edit suite of an install edits a sample of its type files, maps and ped variations, in a process that installed the
# staged snapshot and in one that installed none. One install took twenty-eight minutes beside four other install suites and a
# gate, so it is held to forty-five.
[[profile.all.overrides]]
filter = 'test(a_sample_of_an_installs_typed_files_takes_a_shape_edit_with_and_without_the_staged_snapshot)'
slow-timeout = { period = "60s", terminate-after = 45 }

# The install suite of the maps content reads every `.ymap` and `.ytyp` of an install and runs the rules over all of them as one set.
# It took three minutes alone, so under the load of a whole-workspace run it is held to forty-five, and starts first.
[[profile.all.overrides]]
filter = 'test(the_typed_world_family_names_only_what_the_install_states_and_the_rules_fire_on_few_of_its_maps)'
slow-timeout = { period = "60s", terminate-after = 45 }
priority = 100

# The install suites of a deletion and of a first edit make sources of an install's map files: the census plans an edit of every
# one, and the deletion suite imports the whole tree of each map it samples. Beside building lanes the census took eleven minutes
# on the Legacy install and the deletion suite sixty-nine, of which ninety-eight minutes of processor time on twelve threads, so
# the census is held to forty-five and the deletion suite to two hours, and both start first.
[[profile.all.overrides]]
filter = 'test(the_map_files_of_the_install_a_first_edit_refuses_are_counted)'
slow-timeout = { period = "60s", terminate-after = 45 }
priority = 100

[[profile.all.overrides]]
filter = 'test(deleting_an_entity_of_the_install_keeps_every_link)'
slow-timeout = { period = "60s", terminate-after = 120 }
priority = 100

# The install suite of `maps doors --game` builds the world index of an install in its first child, which reads every map,
# type file and bound, and then lists a dozen maps. Beside building lanes, at a load of a hundred and thirty, that first
# child alone passed the fifteen minutes a slow test is ended at on the Legacy install, so it is held to forty-five.
[[profile.all.overrides]]
filter = 'test(the_doors_of_maps_of_an_install_are_listed_from_the_command_line)'
slow-timeout = { period = "60s", terminate-after = 45 }

# The install suite of putting an entity back is the deletion suite's body over the maps it samples whose tree holds few map files,
# with the entity put back and that taken back before the deletion is undone. Beside building lanes it took three and a half minutes
# on the Legacy install and two and a half on the Enhanced one, and with trees of up to eighty map files thirty-five, so it is
# held to forty-five.
[[profile.all.overrides]]
filter = 'test(an_entity_deleted_from_a_map_of_the_install_is_put_back_as_the_game_has_it)'
slow-timeout = { period = "60s", terminate-after = 45 }
priority = 100

# The install suites of the world index each read every map, type file and bound of an install, and the suite of the index reads
# each again through the mount. Beside building lanes the forest took sixteen minutes on the Legacy install and the suite of the
# index twenty-three on each install, so every test of the binary is held to forty-five.
[[profile.all.overrides]]
filter = 'binary_id(=or-world-gta5::the_world_index_of_a_real_install)'
slow-timeout = { period = "60s", terminate-after = 45 }

# The install suite of the GTA V world behind the contract reads every map, type file and bound of an install twice, once through
# the adapter and once as `world_index` does, where the build's scratch folder keeps no index of it, and a third time for a level of
# DLC, so every test of the binary is held to forty-five minutes, as the suites of the index are.
[[profile.all.overrides]]
filter = 'binary_id(=or-world-gta5::gta5_over_a_real_install)'
slow-timeout = { period = "60s", terminate-after = 45 }

# The install suite of the model catalogue reads the world index of an install once: the first of its tests to run keeps it in
# a file of the scratch folder and the others read that file, so they run one at a time. The first reads every map and type
# file of the install and one walks every map again, so each is held to forty-five minutes, as the suites of the index are.
[[profile.all.overrides]]
filter = 'binary_id(=or-world-gta5::the_models_of_a_real_install)'
slow-timeout = { period = "60s", terminate-after = 45 }
test-group = 'world-models'

# The install suite of GTA VI's texture packs reads every texture of every pack of an install, in three parts by
# folder, the folders dealt by their sizes with the largest first, so that part 1 is the longest. Each part reads its packs on
# every worker it is given, so the parts run one at a time, and start first. On four workers (`RAYON_NUM_THREADS=4`)
# part 1 took thirty minutes alone and forty-eight beside other work, and parts 2 and 3 nineteen and eighteen alone
# and twenty-three and thirty beside it: part 1 is held to seventy-five and the others to forty-five.
[[profile.all.overrides]]
filter = 'test(the_packs_of_part_1_hold_to_the_container_model_and_each_texture_reads_or_is_refused_by_name)'
slow-timeout = { period = "60s", terminate-after = 75 }
priority = 100
test-group = 'gta6-packs'

[[profile.all.overrides]]
filter = 'test(/^the_packs_of_part_[23]_hold_to_the_container_model_and_each_texture_reads_or_is_refused_by_name$/)'
slow-timeout = { period = "60s", terminate-after = 45 }
priority = 100
test-group = 'gta6-packs'

# The GTA VI script suites over a folder run every function of the user's listings through the passes on eight threads
# of their own. No run of them is timed yet, so they are held to forty-five minutes, and start first.
[[profile.all.overrides]]
filter = 'test(/^gta6::script::exec::corpus::/)'
threads-required = 8
slow-timeout = { period = "60s", terminate-after = 45 }
priority = 100

# The install suite of the doors, bounds and path regions reads every map, type file or bound of an install. Its slowest test
# took four minutes on the Legacy install at a load of sixty on thirty cores and twenty-two beside building lanes, so it is held
# to forty-five.
[[profile.all.overrides]]
filter = 'binary_id(=or-maps::the_doors_bounds_and_path_regions_of_the_install)'
slow-timeout = { period = "60s", terminate-after = 45 }

[test-groups]
gta6-packs = { max-threads = 1 }
world-models = { max-threads = 1 }
