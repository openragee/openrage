[package]
name = "or-title"
description = "A game install: editions, archives, DLC overlay order, the VFS"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Archives and the crypto that opens them, with the executable mapped and the
# key scan spread across threads; `gta6` is the scan the GTA VI mount finds its documents by.
or-io = { workspace = true, features = ["fxc", "gta6", "mmap", "rayon"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
quick-xml.workspace = true
# The zip an .oiv package is. Stored entries only: a build writes it with no compressor.
zip = { version = "8", default-features = false }
# Epic names an install in a JSON manifest.
serde_json.workspace = true
# The platform's configuration directory.
dirs.workspace = true
# The day's sun, moon and light directions.
glam.workspace = true
# The executable the day's variable table is read from.
memmap2.workspace = true

# Steam and the Rockstar launcher name an install in the registry.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
or-test-support.workspace = true
# The one test that holds the ported Bink decoders to FFmpeg over every movie an install ships.
or-media.workspace = true
# The crawl's own suite builds a real archive in a scratch directory.
tempfile.workspace = true
