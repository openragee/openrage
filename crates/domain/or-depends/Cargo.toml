[package]
name = "or-depends"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "What an asset needs and where it is placed, resolved over a mounted install"

[dependencies]
# `.ymap`, `.ytyp` and `_manifest.ymf` arrive as value trees.
or-io = { workspace = true, features = ["awc", "meta", "rel"] }
# ⚠ The mount a dependency is resolved over: a dependency is a name until something says which file in which
# archive that name is, and only a mount knows.
or-title.workspace = true
# GTA V's world: the catalogue, the tables, the contents of a model and the world index, which the resolver, the
# census and the export read. ⚠ The edge points this way alone: the adapter names nothing of this crate.
or-world-gta5.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The collision probe the fixture of the world index asks the ground with.
or-world.workspace = true
# The positions the tests of the world index place their maps at.
glam.workspace = true
# The zlib stream a sealed index is, which the tests of the world index open and alter.
flate2.workspace = true
or-test-support.workspace = true
# Scratch folders the tests remove when they end, a failed test's too.
tempfile.workspace = true
